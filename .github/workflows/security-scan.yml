name: Gedr Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Run Security Smoke Test
        run: python tests/smoke_test.py

      - name: Run Full Test Suite
        run: pytest -q

  self-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install --no-cache-dir bandit pip-audit
      - name: Bandit SAST
        run: bandit -r backend/ ai/ scanners/ scanner_connectors/ reports/ database/ -ll --confidence-level high -f json -o bandit-results.json
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.json
        if: always()
      - name: pip-audit dependency check
        run: pip-audit -r requirements.txt || true
      - name: Fail on high-severity Bandit findings
        run: bandit -r backend/ ai/ scanners/ scanner_connectors/ reports/ database/ -l --confidence-level high
