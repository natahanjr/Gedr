version: '3.8'

services:
  # Database Service (optional upgrade target)
  # NOTE: the current backend uses SQLite. The Postgres container is
  # reserved for a future database-driver upgrade (tracked in
  # STRENGTHS_WEAKNESSES.md). It is started so credentials can be
  # provisioned ahead of time; nothing in the app currently connects.
  db:
    image: postgres:15-alpine
    container_name: gedr-db
    restart: always
    profiles: ["postgres"]  # opt-in: docker-compose --profile postgres up -d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gedr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gedr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gedr-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # The backend always uses SQLite; the database file lives on the
      # gedr_data volume (named volumes can only mount directories).
      CCI_DB_PATH: /app/data/cybercode.db
      # Route AI calls to the ai sidecar (same Docker network).
      CCI_AI_MICROSERVICE_URL: http://ai:8002
      CCI_AI_API_KEY: ${CCI_AI_API_KEY:-}
      CCI_AI_PROVIDER: ${CCI_AI_PROVIDER:-native}
      CCI_AI_BASE_URL: ${CCI_AI_BASE_URL:-}
      CCI_AI_MODEL: ${CCI_AI_MODEL:-}
      CCI_ALLOWED_SCAN_ROOTS: ${CCI_ALLOWED_SCAN_ROOTS:-}
      CCI_SSL_KEYFILE: ${CCI_SSL_KEYFILE:-}
      CCI_SSL_CERTFILE: ${CCI_SSL_CERTFILE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # Persist the SQLite database between container restarts.
      # CCI_DB_PATH points inside this directory.
      - gedr_data:/app/data
    depends_on:
      - ai

  # AI Service
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: cybercode-ai
    restart: always
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      AI_PRIMARY_KEY: ${CCI_AI_API_KEY:-}
      AI_PRIMARY_MODEL: ${CCI_AI_MODEL:-}
      AI_PRIMARY_URL: ${CCI_AI_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scanner Environment (Standalone)
  scanners:
    build:
      context: ./docker
      dockerfile: Dockerfile.scanners
    container_name: cybercode-scanners
    image: cybercode-scanners:latest

  # OpenVAS (Greenbone) — full vulnerability scanner
  openvas:
    image: greenbone/gvmd:latest
    container_name: cybercode-openvas
    restart: unless-stopped
    profiles: ["scanners"]
    ports:
      - "127.0.0.1:9390:9390"
    environment:
      GVMD_PASSWORD: ${OPENVAS_PASSWORD:-admin}
    volumes:
      - openvas_data:/var/lib/gvm

  # Nmap — network/port scanner (used on-demand, kept for connector availability)
  nmap:
    image: instrumentisto/nmap:latest
    container_name: cybercode-nmap
    restart: unless-stopped
    profiles: ["scanners"]
    entrypoint: ["sleep", "infinity"]

volumes:
  postgres_data:
  openvas_data:
  gedr_data:
