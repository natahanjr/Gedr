version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gedr-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CCI_AI_API_KEY: ${CCI_AI_API_KEY:-}
      CCI_AI_PROVIDER: ${CCI_AI_PROVIDER:-native}
      CCI_AI_BASE_URL: ${CCI_AI_BASE_URL:-}
      CCI_AI_MODEL: ${CCI_AI_MODEL:-}
      CCI_ALLOWED_SCAN_ROOTS: ${CCI_ALLOWED_SCAN_ROOTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - gedr_data:/app/data

  # AI Service
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: cybercode-ai
    restart: always
    ports:
      - "8002:8002"
    environment:
      AI_PRIMARY_KEY: ${AI_PRIMARY_KEY}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_PRIMARY_URL: ${AI_PRIMARY_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ai/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scanner Environment (Standalone)
  scanners:
    build:
      context: ./docker
      dockerfile: Dockerfile.scanners
    container_name: cybercode-scanners
    image: cybercode-scanners:latest

  # OpenVAS (Greenbone) — full vulnerability scanner
  openvas:
    image: greenbone/gvmd:latest
    container_name: cybercode-openvas
    restart: unless-stopped
    profiles: ["scanners"]
    ports:
      - "9390:9390"
    environment:
      GVMD_PASSWORD: ${OPENVAS_PASSWORD:-admin}
    volumes:
      - openvas_data:/var/lib/gvm

  # Nmap — network/port scanner (used on-demand, kept for connector availability)
  nmap:
    image: instrumentisto/nmap:latest
    container_name: cybercode-nmap
    restart: unless-stopped
    profiles: ["scanners"]
    entrypoint: ["sleep", "infinity"]

volumes:
  openvas_data:
  gedr_data:
